<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Axiom CDN</title>
  <link rel="icon" href="favicon.ico">
  <script src="client.js"></script>
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <h1>Axiom CDN</h1>

  <form ref='uploadForm' id='uploadForm' action='./' method='post' encType="multipart/form-data">
    <div id="dropZone">
      <div class="upload-icon">📁</div>
      <div>Drag and drop your file here</div>
      <div style="margin: 10px 0;">or</div>
      <button type="button" class="browse-button" id="browseButton">Browse Files</button>
      <input type="file" name="file" id="file" />
    </div>
  </form>

  <div id="progressLine">✨ Ready to upload</div>

  <h3>File list:</h3>
  <div id="files"></div>

  <footer>
    Created by ArmoredFuzzball 🦊
    <br><span class="size-limit">Size limit: 50GB</span>
  </footer>
</body>

</html>
